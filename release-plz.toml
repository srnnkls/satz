[workspace]
changelog_config = ".loqui/rust-release/cliff.toml"
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
release_always = false
changelog_update = false
# crates.io rejects the git revision of markdown-it-rs that satz builds on.
git_only = true

[[package]]
name = "satz-cli"
git_tag_enable = true
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["satz"]
