[workspace]
members = ["crates/satz", "crates/satz-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/srnnkls/satz"
authors = ["Sören Nikolaus <soeren@code17.io>"]

[workspace.dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ignore = "0.4.35"
markdown-it-rs = { git = "https://github.com/GSGFs7/markdown-it-rs", rev = "fffca16c2c231f25e9f37d1997c7a7e68576f107", version = "0.7.0", default-features = false, features = ["sourcemap"] }
model2vec-rs = { version = "0.5.1", default-features = false, features = ["fancy-regex", "local-only"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.2"
saphyr-parser = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.3", features = ["preserve_order"] }
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
dbg_macro = "warn"
mem_forget = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
