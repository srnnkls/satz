[tools]
go = "1.27.1"

[tasks.lint]
description = "Run golangci-lint and reject suppression directives"
run = [
  "go tool golangci-lint run ./...",
  "! grep -rn --include='*.go' '//nolint' .",
]

[tasks.fmt]
description = "Format with gofumpt and goimports"
run = "go tool golangci-lint fmt ./..."

[tasks.fix]
description = "Preview go fix modernizations; fails when any are pending"
run = "test -z \"$(go fix -diff ./...)\""

[tasks.test]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks.check]
description = "Lint, preview fixes and test"
depends = ["lint", "fix", "test"]
