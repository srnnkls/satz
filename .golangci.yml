version: "2"

run:
  tests: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/srnnkls/tela

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - nilerr
    - nilnil
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
    wrapcheck:
      ignore-package-globs:
        - github.com/srnnkls/tela/*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
